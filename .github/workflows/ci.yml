name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Typecheck, lint y tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (back y front)
        run: npm run typecheck

      - name: Lint (back y front)
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build (back y front)
        run: npm run build
