# Despliegue completo de CRMIA (produccion / demo en servidor).
#
#   npm run build                      # genera front/dist
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Caddy sirve el front estatico (front/dist) y hace de proxy inverso a /api.
# Las variables se interpolan desde el fichero .env de la raiz.
#
# PUERTOS PUBLICADOS
# Postgres y Gotenberg viven solo en la red interna de compose: nadie fuera del
# stack los necesita y no publicarlos evita choques con otros proyectos del
# mismo host. Los dos servicios que si se publican (Caddy y ONLYOFFICE) llevan
# la asignacion completa en una variable, de modo que un servidor compartido
# puede atarlos a loopback y a puertos altos
# (p.ej. CADDY_HTTP_PUBLISH=127.0.0.1:8088:80) y delegar dominio y TLS en el
# proxy inverso que ya escucha en 80/443. Sin variables, los valores por
# defecto reproducen el despliegue clasico con Caddy como frontal.

name: crmia

services:
  postgres:
    image: postgres:15-alpine
    container_name: crmia_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      POSTGRES_DB: ${DB_DATABASE:-crmia}
    # Sin `ports`: la base de datos solo se alcanza por la red de compose, que
    # es la unica que la necesita. Para inspeccionarla puntualmente:
    #   docker compose -f docker-compose.prod.yml exec postgres psql -U postgres crmia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-crmia}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - crmia_net

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: crmia_gotenberg_prod
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=120s
      - --chromium-disable-javascript=false
    # Sin `ports`: solo lo consume el backend, dentro de la red de compose.
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - crmia_net

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: crmia_onlyoffice_prod
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Define ONLYOFFICE_JWT_SECRET en .env}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
    ports:
      # ONLYOFFICE sirve su api.js al navegador del usuario, asi que necesita
      # salida publica si o si (a diferencia de Postgres y Gotenberg).
      - "${ONLYOFFICE_PUBLISH:-8081:80}"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_cache:/var/lib/onlyoffice/documentserver/App_Data/cache/files
    healthcheck:
      test:
        ["CMD", "curl", "--silent", "--fail", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - crmia_net

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    image: crmia-back:latest
    container_name: crmia_back
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_started
      onlyoffice:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      URL: ${URL:-http://localhost}
      # Base de la que cuelgan los enlaces publicos de firma
      # (`${FRONTEND_URL}/firmar/<token>`, ver contracts.service.ts). El front y
      # la API comparten origen detras de Caddy, asi que coincide con URL.
      FRONTEND_URL: ${FRONTEND_URL:-${URL:-http://localhost}}
      # Contrasena del administrador semilla (admin@crmia.local) que crea
      # `AppModule.onModuleInit` en el primer arranque. Sin esta variable el
      # contenedor se quedaba con el `admin1234` por defecto del esquema Joi.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
      # Base de datos (host interno de la red de compose)
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      DB_DATABASE: ${DB_DATABASE:-crmia}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      DB_LOGGING: ${DB_LOGGING:-false}
      # Autenticacion
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      # IA: DOS proveedores compatibles con OpenAI, en cadena. El asistente
      # pregunta al primario y, si no responde, repite contra el respaldo.
      # En este despliegue el primario es Cloudflare Workers AI (~1 s) y el
      # respaldo NVIDIA (~2 s), de forma que la caida de uno no deja al CRM
      # sin asistente.
      #
      # Los nombres antiguos `NVIDIA_*` siguen valiendo como respaldo de la
      # interpolacion: un `.env` que solo los tenga sigue arrancando igual.
      LLM_API_KEY: ${LLM_API_KEY:-${NVIDIA_API_KEY:?Define LLM_API_KEY o NVIDIA_API_KEY en .env}}
      LLM_BASE_URL: ${LLM_BASE_URL:-${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}}
      LLM_MODEL: ${LLM_MODEL:-${NVIDIA_MODEL:-openai/gpt-oss-120b}}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-${NVIDIA_TIMEOUT_MS:-8000}}
      # Respaldo. Vacias = mismo proveedor que el primario con otro modelo.
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_TIMEOUT_MS: ${LLM_FALLBACK_TIMEOUT_MS:-}
      # Transcripcion de voz
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:?Define ELEVENLABS_API_KEY en .env}
      # Documentos: ONLYOFFICE necesita DOS URLs distintas y no son
      # intercambiables.
      #
      # - ONLYOFFICE_URL es la INTERNA: el nombre del servicio en la red de
      #   compose. Solo la usa el backend para hablar con el Document Server
      #   (descargar del cache la version editada tras un callback).
      # - ONLYOFFICE_PUBLIC_URL es la que el backend manda al NAVEGADOR como
      #   `scriptUrl`, asi que tiene que ser el dominio publico del Document
      #   Server (p.ej. https://crmia-office.midominio.tld). Publicar aqui la
      #   interna es el fallo que dejaba al editor en "No se pudo contactar con
      #   el servidor de edicion": `http://onlyoffice` no resuelve fuera de
      #   Docker. Se acepta el nombre antiguo ONLYOFFICE_URL del .env como
      #   respaldo para no romper despliegues ya configurados.
      ONLYOFFICE_URL: http://onlyoffice
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:-${ONLYOFFICE_URL:-http://localhost:8081}}
      # Como ve el contenedor de ONLYOFFICE a la API del CRM (`document.url` y
      # `callbackUrl`). Vacia = se deriva de URL, que es lo correcto cuando el
      # proxy inverso admite hairpin desde dentro del host. Si no lo admite,
      # ponla a `http://caddy` (el frontal del propio stack).
      ONLYOFFICE_INTERNAL_API_URL: ${ONLYOFFICE_INTERNAL_API_URL:-}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Define ONLYOFFICE_JWT_SECRET en .env}
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - back_uploads:/app/uploads
    expose:
      - "3000"
    networks:
      - crmia_net

  caddy:
    image: caddy:2-alpine
    container_name: crmia_caddy
    restart: unless-stopped
    depends_on:
      - back
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@example.com}
    ports:
      - "${CADDY_HTTP_PUBLISH:-80:80}"
      # Los dos mapeos de TLS solo hacen falta cuando este Caddy es el frontal
      # real (CADDY_SITE_ADDRESS con un dominio). Detras de otro proxy inverso
      # se atan a loopback para no disputarle el 443 al de delante.
      - "${CADDY_HTTPS_PUBLISH:-443:443}"
      - "${CADDY_HTTPS_UDP_PUBLISH:-443:443/udp}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./front/dist:/srv/front:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - crmia_net

networks:
  crmia_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  onlyoffice_data:
    driver: local
  onlyoffice_logs:
    driver: local
  onlyoffice_cache:
    driver: local
  back_uploads:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
